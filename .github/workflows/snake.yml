name: GitHub Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: camila-ubt
          outputs: |
            dist/github-snake.svg?color_snake=%238B5CF6&color_dots=%23FFFFFF,%23EDE9FE,%23DDD6FE,%23C4B5FD,%23A78BFA

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
