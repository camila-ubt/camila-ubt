name: GitHub Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: camila-ubt
          outputs: |
            dist/github-snake-light.svg?color_snake=%236D28D9&color_dots=%23D6D6D6,%23E9D5FF,%23D8B4FE,%23A78BFA,%237C3AED

      - name: Ajustar contorno dos quadrados vazios
        run: |
          sed -i 's/--cb:#1b1f230a/--cb:#BDBDBD/g' dist/github-snake-light.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
